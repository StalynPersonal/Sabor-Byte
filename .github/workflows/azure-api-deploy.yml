name: Publicar Api en Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'Api/**'
      - 'Aplicacion/**'
      - 'Infraestructura/**'
      - 'Dominio/**'
      - 'FacturacionElectronica/**'
      - '.github/workflows/azure-api-deploy.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: app-saborbyte-api
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependencias
        run: dotnet restore Api/SaborByte.Api.csproj

      - name: Publicar
        run: dotnet publish Api/SaborByte.Api.csproj -c Release -o ./publish --no-restore

      - name: Desplegar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
