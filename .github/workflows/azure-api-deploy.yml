name: Publicar Api en Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'Api/**'
      - 'Aplicacion/**'
      - 'Infraestructura/**'
      - 'Dominio/**'
      - 'FacturacionElectronica/**'
      - '.github/workflows/azure-api-deploy.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: app-saborbyte-api
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependencias
        run: dotnet restore Api/SaborByte.Api.csproj

      # --- Migraciones de base de datos ---
      # Se aplican ANTES de desplegar el código nuevo, para que el esquema ya esté listo
      # cuando la Api arranque con la versión nueva (evita el error "Invalid column name"
      # que tumbó producción el 2026-09-10: el código llegaba antes que la migración).
      - name: Iniciar sesión en Azure
        uses: azure/login@v2
        with:
          # Service principal clásico (usuario/contraseña de app), no OIDC — más simple de
          # configurar. AZURE_CREDENTIALS es un JSON: {"clientId","clientSecret","subscriptionId","tenantId"}.
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Abrir temporalmente el firewall de SQL para este runner
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          az sql server firewall-rule create \
            --resource-group rg-saborbyte-prod \
            --server sql-saborbyte-prod-br \
            --name "GitHubActionsRunner-Temp" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP"

      - name: Instalar dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Aplicar migraciones pendientes a producción
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update \
            --context SaborByteDbContext \
            --project Infraestructura/SaborByte.Infraestructura.csproj \
            --startup-project Api/SaborByte.Api.csproj \
            --connection "${{ secrets.AZURE_SQL_CONNECTION_STRING_PROD }}"

      - name: Cerrar el firewall de SQL para este runner
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group rg-saborbyte-prod \
            --server sql-saborbyte-prod-br \
            --name "GitHubActionsRunner-Temp" || true

      - name: Publicar
        run: dotnet publish Api/SaborByte.Api.csproj -c Release -o ./publish --no-restore

      - name: Desplegar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
