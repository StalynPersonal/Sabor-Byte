server {
    listen 8080;
    root /usr/share/nginx/html;

    # Blazor WASM necesita el tipo MIME correcto para .wasm y .dll para que el
    # navegador los cargue; nginx no lo trae por defecto.
    types {
        application/wasm wasm;
        application/octet-stream dll;
    }

    # SPA fallback: cualquier ruta que no sea un archivo real cae en index.html,
    # para que el router de Blazor la resuelva del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
